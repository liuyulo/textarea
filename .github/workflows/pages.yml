name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Delete past workflow runs
        run: |
          gh api /repos/${{ github.repository }}/actions/runs -q '.workflow_runs[] | .id' \
          | tail -n +2 \
          | xargs -P0 -tI{} gh api -X DELETE /repos/${{ github.repository }}/actions/runs/{}
        env:
          GH_TOKEN: ${{ github.token }}
